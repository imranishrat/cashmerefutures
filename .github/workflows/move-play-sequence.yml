name: Move play sequence button
on:
  push:
    paths:
      - '.github/workflows/move-play-sequence.yml'
jobs:
  move-button:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move play button beside heading
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supply-chain.html')
          s=p.read_text()
          old='<div class="pathway-head"><h3 class="pathway-title">The cashmere transformation pathway</h3><span class="pathway-caption">Biological origin → material transformation → market value</span></div>'
          new='<div class="pathway-head"><div class="pathway-title-row"><h3 class="pathway-title">The cashmere transformation pathway</h3><button class="pathway-play" id="pathPlay" type="button" aria-pressed="false"><span class="pathway-play-dot"></span><span id="pathPlayLabel">Play sequence</span></button></div><span class="pathway-caption">Biological origin → material transformation → market value</span></div>'
          assert old in s
          s=s.replace(old,new,1)
          old2='<div class="pathway-controls"><button id="pathPrev" type="button">← Previous</button><button class="pathway-play" id="pathPlay" type="button" aria-pressed="false"><span class="pathway-play-dot"></span><span id="pathPlayLabel">Play sequence</span></button><span class="pathway-progress" aria-hidden="true"></span><button id="pathNext" type="button">Next →</button></div>'
          new2='<div class="pathway-controls"><button id="pathPrev" type="button">← Previous</button><span class="pathway-progress" aria-hidden="true"></span><button id="pathNext" type="button">Next →</button></div>'
          assert old2 in s
          s=s.replace(old2,new2,1)
          oldcss='.pathway{margin-top:34px;padding:30px 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.pathway-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:26px}.pathway-title{font:500 25px/1.2 Fraunces,Georgia,serif;color:var(--ink);margin:0}'
          newcss='.pathway{margin-top:34px;padding:30px 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.pathway-head{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:26px}.pathway-title-row{display:flex;align-items:center;gap:16px;min-width:0}.pathway-title{font:500 25px/1.2 Fraunces,Georgia,serif;color:var(--ink);margin:0}'
          assert oldcss in s
          s=s.replace(oldcss,newcss,1)
          oldsel='.pathway-play.is-playing + .pathway-progress::after{animation:pathway-progress 4.8s linear infinite}'
          newsel='.pathway.is-playing .pathway-progress::after{animation:pathway-progress 4.8s linear infinite}'
          assert oldsel in s
          s=s.replace(oldsel,newsel,1)
          oldstart="function startPath(){if(timer)return;document.getElementById('pathPlay').classList.add('is-playing');"
          newstart="function startPath(){if(timer)return;document.getElementById('pathPlay').classList.add('is-playing');document.getElementById('pathway').classList.add('is-playing');"
          assert oldstart in s
          s=s.replace(oldstart,newstart,1)
          oldstop="function stopPath(){if(timer){clearInterval(timer);timer=null}document.getElementById('pathPlay').classList.remove('is-playing');"
          newstop="function stopPath(){if(timer){clearInterval(timer);timer=null}document.getElementById('pathPlay').classList.remove('is-playing');document.getElementById('pathway').classList.remove('is-playing');"
          assert oldstop in s
          s=s.replace(oldstop,newstop,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supply-chain.html
          git commit -m 'Move play sequence beside pathway heading'
          git push
