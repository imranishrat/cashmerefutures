name: Populate fibre and market data
on:
  push:
    paths:
      - '.github/workflows/populate-fibre-market-data.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Populate audited fibre and market data
        env:
          NEW_BLOCK: ' '
        run: python -c "import os,base64;from pathlib import Path;p=Path('library.html');s=p.read_text();old='<a class=\"lib-resource\" href=\"#data-statistics\"><strong>Fibre &amp; Market Data</strong><span>Fibre characteristics, prices and market indicators.</span><em>Planned</em></a>';new=base64.b64decode(os.environ['NEW_BLOCK']).decode();assert old in s;p.write_text(s.replace(old,new,1))"
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library.html
          git commit -m 'Populate audited fibre and market data'
          git rm .github/workflows/populate-fibre-market-data.yml
          git commit -m 'Remove temporary fibre and market data workflow'
          git push
