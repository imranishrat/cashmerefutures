name: Align production note
on:
  push:
    paths:
      - '.github/workflows/final-production-note.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update data integrity note
        run: |
          python -c "from pathlib import Path; p=Path('library.html'); s=p.read_text(); old='In particular, the previously displayed figures for Iran, India, Pakistan, Kazakhstan, Kyrgyzstan, Turkey, Nepal, Uzbekistan and New Zealand remain excluded pending adequate source verification. Afghanistan is included only as a dated 2015 secondary estimate and must not be interpreted as a current production figure. No estimate has been substituted for a missing observation.'; new='In particular, Pakistan, Kazakhstan, Kyrgyzstan, Turkey, Nepal, Uzbekistan and New Zealand remain without a country-level production total because no adequately substantiated figure was identified. Pakistan’s recent official statistics report total goat-hair production but do not disaggregate cashmere; regional research confirms pashmina-bearing goats in Gilgit-Baltistan but does not provide a defensible contemporary regional or national cashmere total. Afghanistan is included only as a dated 2015 secondary estimate, while Iran and India are retained as explicitly qualified historical estimates. No estimate has been substituted for a missing observation.'; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library.html
          git commit -m 'Clarify production data integrity note'
          git rm .github/workflows/final-production-note.yml
          git commit -m 'Remove temporary production note workflow'
          git push