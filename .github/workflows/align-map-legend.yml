name: Align map legend
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  align:
    if: github.event.head_commit.message != 'Align map legend with top edge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align legend
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supply-chain.html')
          s = p.read_text()
          s = s.replace('right:8px;top:50%;bottom:auto;left:auto;transform:translateY(-50%)', 'right:8px;top:16px;bottom:auto;left:auto;transform:none')
          s = s.replace('right:5px;top:50%;bottom:auto;left:auto;transform:translateY(-50%)', 'right:5px;top:8px;bottom:auto;left:auto;transform:none')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supply-chain.html
          git diff --cached --quiet || git commit -m "Align map legend with top edge"
          git push
