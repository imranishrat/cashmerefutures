name: Fix fibre market data 3
on:
  push:
    paths:
      - '.github/workflows/fix-fibre-market-data-3.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix fibre data
        run: python -c "from pathlib import Path;p=Path('library.html');s=p.read_text();s=s.replace('          <liv class=\"lib-resource lib-resource-wide\">','          <div class=\"lib-resource lib-resource-wide\">',1);s=s.replace('<strong>Fibre & Market Data</strong>','<strong>Fibre &amp; Market Data</strong>',1);s=s.replace('12–18 ớ','12–18',1);s=s.replace('<td>°m</td>','<td>μm</td>',1);s=s.replace('<td><s>&lt;ter than 18</s></td>','<td>&lt;18</td>',1);s=s.replace('<td>³m</td>','<td>μm</td>',1);s=s.replace('finner than 18 ớ','finer than 18 μm',1);s=s.replace('0.525 deahaired cashmere per 1 kg raw cashmere','0.525',1);s=s.replace('Cashhmere value chain analyses in Mongolia, using washing loss 30% and dehairing loss 25%','Cashmere value chain analyses in Mongolia',1);s=s.replace('Raw\\ncommongolian cashmere purchase price','Raw Mongolian cashmere purchase price',1);s=s.replace('Sistainable Fibre Alliance, 2024, reporting mongolian raw cashmere prices','Sustainable Fibre Alliance, 2024',1);p.write_text(s)"
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library.html
          git commit -m 'Fix fibre market data markup'
          git rm .github/workflows/fix-fibre-market-data-3.yml
          git commit -m 'Remove temporary fibre market data fix workflow'
          git push
