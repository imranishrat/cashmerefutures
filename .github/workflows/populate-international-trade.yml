name: Populate international trade
on:
  push:
    paths:
      - '.github/workflows/populate-international-trade.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Populate audited trade data
        run: python -c "from pathlib import Path;p=Path('library.html');s=p.read_text();old='<a class=\"lib-resource\" href=\"#data-statistics\"><strong>International Trade</strong><span>Exports, imports, quantities and trade values.</span><em>Planned</em></a>';new=Path('trade-block.html').read_text();assert old in s;p.write_text(s.replace(old,new,1))"
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library.html
          git commit -m 'Populate audited international trade data'
          git rm .github/workflows/populate-international-trade.yml trade-block.html
          git commit -m 'Remove temporary international trade files'
          git push
