name: Audit production data
on:
  push:
    paths:
      - '.github/workflows/audit-production-data.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production data
        run: |
          grep -n -A18 -B2 "production" supply-chain.html > production-inspection.txt || true
          grep -n -A12 -B2 "Afghanistan" library.html > library-inspection.txt || true
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-inspection.txt library-inspection.txt
          git commit -m 'Inspect production data structure'
          git push