name: Audit production data
on:
  push:
    paths:
      - '.github/workflows/audit-production-data.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact data snippets
        run: |
          grep -o '.\{0,120\}17589.\{0,1200\}' supply-chain.html > production-snippet.txt || true
          grep -o '.\{0,120\}<td>Afghanistan</td>.\{0,1800\}' library.html > library-snippet.txt || true
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-snippet.txt library-snippet.txt
          git commit -m 'Inspect exact production data snippets'
          git push