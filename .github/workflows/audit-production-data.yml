name: Audit production data
on:
  push:
    paths:
      - '.github/workflows/audit-production-data.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update audited production data
        shell: python
        run: |
          from pathlib import Path
          import re

          # Supply Chain map: replace only the production dataset.
          p = Path('supply-chain.html')
          s = p.read_text(encoding='utf-8')
          old = "const production={\n  'China':{v:17589,label:'17,589 t',basis:'2023'},\n  'Mongolia':{v:10092,label:'10,092 t',basis:'2022'},\n  'Afghanistan':{v:1900,label:'<2,000 t',basis:'2018 estimate'},\n  'Iran':{v:1900,label:'<2,000 t',basis:'2018 estimate'},\n  'Kazakhstan':{v:null,label:'Small; not quantified',basis:'published sources'},\n  'Kyrgyzstan':{v:null,label:'Small; not quantified',basis:'published sources'},\n  'Pakistan':{v:60,label:'60 t',basis:'indicative figure'},\n  'India':{v:70,label:'70 t',basis:'historical estimate'},\n  'Turkey':{v:null,label:'Small; not quantified',basis:'published sources'},\n  'Nepal':{v:null,label:'Small; not quantified',basis:'published sources'},\n  'Uzbekistan':{v:null,label:'Small; not quantified',basis:'published sources'},\n  'New Zealand':{v:4.9,label:'<5 t',basis:'published estimate'}\n};"
          new = "const production={\n  'China':{v:17589,label:'17,589 t',basis:'2023'},\n  'Mongolia':{v:10500,label:'~10,500 t',basis:'2023'},\n  'Afghanistan':{v:1000,label:'~1,000 t',basis:'2015 estimate'},\n  'Iran':{v:2000,label:'~2,000 t',basis:'2014 estimate'},\n  'India':{v:50,label:'50 t',basis:'2013–14 estimate'},\n  'Kazakhstan':{v:null,label:'Not quantified',basis:'no adequately substantiated production total'},\n  'Kyrgyzstan':{v:null,label:'Not quantified',basis:'no adequately substantiated production total'},\n  'Pakistan':{v:null,label:'Not substantiated',basis:'recent official data do not disaggregate cashmere'},\n  'Turkey':{v:null,label:'Not quantified',basis:'no adequately substantiated production total'},\n  'Nepal':{v:null,label:'Not quantified',basis:'no adequately substantiated production total'},\n  'Uzbekistan':{v:null,label:'Not quantified',basis:'no adequately substantiated production total'},\n  'New Zealand':{v:null,label:'Not quantified',basis:'no adequately substantiated production total'}\n};"
          if old not in s:
              raise SystemExit('Expected production dataset was not found; no map change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Library: add only audited historical observations with explicit qualification.
          p = Path('library.html')
          s = p.read_text(encoding='utf-8')
          anchor = "        <tr><td>Afghanistan</td><td>2015</td><td>~1,000</td><td>tonnes</td><td>Dawn (2015), reporting estimates attributed to the World Bank and USAID</td><td>Secondary public reporting based on institutional estimates</td><td>Estimated annual cashmere production. The source reports Afghanistan as the world's third-largest producer at about 1,000 metric tonnes per year and attributes the underlying estimate to the World Bank and USAID. This is an older estimate, not a current official national statistic; it is retained only as a dated historical observation.</td></tr>"
          additions = anchor + "\n        <tr><td>Iran</td><td>2014</td><td>~2,000</td><td>tonnes/year</td><td>Ansari-Renani, <em>A Value Chain and Marketing of Iranian Cashmere</em>, Media Peternakan 37(1), 2014</td><td>Peer-reviewed published estimate</td><td>The exact quantity is stated as unknown; the study estimates that about 5 million cashmere goats produce approximately 2,000 tonnes of raw cashmere annually. Historical estimate, not an official national statistic.</td></tr>\n        <tr><td>India</td><td>2013–14</td><td>50</td><td>tonnes/year</td><td><em>Cashmere producing smallholder nomads of Himalaya: Survival challenges of a system</em></td><td>Peer-reviewed regional/secondary production estimate</td><td>India's pashmina production is reported at about 50 tonnes/year, with Changthangi contributing approximately 90%. Historical regional pashmina figure; not a current comprehensive national cashmere series.</td></tr>"
          if anchor not in s:
              raise SystemExit('Expected library Afghanistan row was not found; no library change made.')
          s = s.replace(anchor, additions, 1)
          old_note = "In particular, the previously displayed figures for Iran, India, Pakistan, Kazakhstan, Kyrgyzstan, Turkey, Nepal, Uzbekistan and New Zealand remain excluded pending adequate source verification. Afghanistan is included only as a dated 2015 secondary estimate and must not be interpreted as a current production figure. No estimate has been substituted for a missing observation."
          new_note = "In particular, Pakistan, Kazakhstan, Kyrgyzstan, Turkey, Nepal, Uzbekistan and New Zealand remain without a country-level production total because no adequately substantiated figure was identified. Pakistan's recent official statistics report total goat-hair production but do not disaggregate cashmere; regional research confirms pashmina-bearing goats in Gilgit-Baltistan but does not provide a defensible contemporary regional or national cashmere total. Afghanistan is included only as a dated 2015 secondary estimate, while Iran and India are retained as explicitly qualified historical estimates. No estimate has been substituted for a missing observation."
          if old_note not in s:
              raise SystemExit('Expected library data-integrity note was not found; no note change made.')
          s = s.replace(old_note, new_note, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit audited data and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supply-chain.html library.html
          git commit -m 'Update cashmere production data from audited sources' || true
          git rm .github/workflows/audit-production-data.yml
          git commit -m 'Remove temporary production audit workflow'
          git push