name: Audit additional cashmere production sources
on:
  push:
    paths:
      - '.github/workflows/audit-production-data.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add substantiated Afghanistan observation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('library.html')
          s=p.read_text()
          old='''        <tr><td>Mongolia</td><td>2023</td><td>10,500</td><td>tonnes</td><td>GOBI JSC Sustainability Report 2023, citing National Statistics Committee</td><td>Company sustainability report using national statistics</td><td>Reported as approximately 10.5 thousand tonnes of raw cashmere; the report's chart identifies National Statistics Committee and says the series is by calculation method. Retain the published approximation rather than implying greater precision.</td></tr>'''
          new=old+'''\n        <tr><td>Afghanistan</td><td>2015</td><td>~1,000</td><td>tonnes</td><td>Dawn (2015), reporting estimates attributed to the World Bank and USAID</td><td>Secondary public reporting based on institutional estimates</td><td>Estimated annual cashmere production. The source reports Afghanistan as the world's third-largest producer at about 1,000 metric tonnes per year and attributes the underlying estimate to the World Bank and USAID. This is an older estimate, not a current official national statistic; it is retained only as a dated historical observation.</td></tr>'''
          assert old in s
          s=s.replace(old,new,1)
          oldnote='''In particular, the previously displayed figures for Afghanistan, Iran, India, Pakistan, Kazakhstan, Kyrgyzstan, Turkey, Nepal, Uzbekistan and New Zealand are excluded from this initial dataset pending source verification.'''
          newnote='''In particular, the previously displayed figures for Iran, India, Pakistan, Kazakhstan, Kyrgyzstan, Turkey, Nepal, Uzbekistan and New Zealand remain excluded pending adequate source verification. Afghanistan is included only as a dated 2015 secondary estimate and must not be interpreted as a current production figure.'''
          assert oldnote in s
          s=s.replace(oldnote,newnote,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library.html
          git commit -m 'Add dated Afghanistan cashmere production estimate'
          git push
          git rm .github/workflows/audit-production-data.yml
          git commit -m 'Remove temporary audit workflow'
          git push
