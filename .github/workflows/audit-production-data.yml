name: Audit production data
on:
  push:
    paths:
      - '.github/workflows/audit-production-data.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract data snippets
        run: |
          python -c "from pathlib import Path; s=Path('supply-chain.html').read_text(); i=s.find('17589'); Path('production-snippet.txt').write_text(s[max(0,i-300):i+1500] if i>=0 else '17589 not found')"
          python -c "from pathlib import Path; s=Path('library.html').read_text(); i=s.find('<td>Afghanistan</td>'); Path('library-snippet.txt').write_text(s[max(0,i-300):i+2200] if i>=0 else 'Afghanistan not found')"
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-snippet.txt library-snippet.txt
          git commit -m 'Inspect exact production data snippets'
          git push