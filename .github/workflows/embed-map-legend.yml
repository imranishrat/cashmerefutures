name: Embed map legend in map
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Embed map legend inside map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move legend inside map container
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supply-chain.html')
          s=p.read_text()
          old='''<div class="cashmere-map" id="cashmereMap" role="img" aria-label="World map showing cashmere-producing countries shaded by indicative production volume"></div><div class="map-legend">'''
          new='''<div class="cashmere-map" id="cashmereMap" role="img" aria-label="World map showing cashmere-producing countries shaded by indicative production volume"><div class="map-legend">'''
          if old not in s: raise SystemExit('map opening pattern not found')
          s=s.replace(old,new,1)
          old2='''<span class="legend-item"><span class="legend-swatch unknown"></span>Not quantified</span></div><p class="map-note">'''
          new2='''<span class="legend-item"><span class="legend-swatch unknown"></span>Not quantified</span></div></div><p class="map-note">'''
          if old2 not in s: raise SystemExit('legend closing pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supply-chain.html
          git diff --cached --quiet || git commit -m 'Embed map legend inside map'
          git push
