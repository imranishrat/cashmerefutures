name: Final production audit
on:
  push:
    paths:
      - '.github/workflows/final-production-audit.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audited production data
        run: |
          python -c "from pathlib import Path; p=Path('supply-chain.html'); s=p.read_text(); old=\"const production={'China':{v:17589,label:'17,589 t',basis:'2023'},'Mongolia':{v:10092,label:'10,092 t',basis:'2022'},'Afghanistan':{v:1900,label:'<2,000 t',basis:'2018 estimate'},'Iran':{v:1900,label:'<2,000 t',basis:'2018 estimate'},'Kazakhstan':{v:null,label:'Small; not quantified',basis:'published sources'},'Kyrgyzstan':{v:null,label:'Small; not quantified',basis:'published sources'},'Pakistan':{v:60,label:'60 t',basis:'indicative figure'},'India':{v:70,label:'70 t',basis:'historical estimate'},'Turkey':{v:null,label:'Small; not quantified',basis:'published sources'},'Nepal':{v:null,label:'Small; not quantified',basis:'published sources'},'Uzbekistan':{v:null,label:'Small; not quantified',basis:'published sources'},'New Zealand':{v:4.9,label:'<5 t',basis:'published estimate'}};\"; new=\"const production={'China':{v:17589,label:'17,589 t',basis:'2023'},'Mongolia':{v:10500,label:'~10,500 t',basis:'2023'},'Afghanistan':{v:1000,label:'~1,000 t',basis:'2015 estimate'},'Iran':{v:2000,label:'~2,000 t',basis:'2014 estimate'},'India':{v:50,label:'50 t',basis:'2013–14 estimate'},'Kazakhstan':{v:null,label:'Not quantified',basis:'no adequately substantiated production total'},'Kyrgyzstan':{v:null,label:'Not quantified',basis:'no adequately substantiated production total'},'Pakistan':{v:null,label:'Not substantiated',basis:'recent official data do not disaggregate cashmere'},'Turkey':{v:null,label:'Not quantified',basis:'no adequately substantiated production total'},'Nepal':{v:null,label:'Not quantified',basis:'no adequately substantiated production total'},'Uzbekistan':{v:null,label:'Not quantified',basis:'no adequately substantiated production total'},'New Zealand':{v:null,label:'Not quantified',basis:'no adequately substantiated production total'}};\"; assert old in s, 'map dataset not found'; p.write_text(s.replace(old,new,1))"
          python -c "from pathlib import Path; p=Path('library.html'); s=p.read_text(); old=\"        <tr><td>Afghanistan</td><td>2015</td><td>~1,000</td><td>tonnes</td><td>Dawn (2015), reporting estimates attributed to the World Bank and USAID</td><td>Secondary public reporting based on institutional estimates</td><td>Estimated annual cashmere production. The source reports Afghanistan as the world's third-largest producer at about 1,000 metric tonnes per year and attributes the underlying estimate to the World Bank and USAID. This is an older estimate, not a current official national statistic; it is retained only as a dated historical observation.</td></tr>\"; add=old+\"\\n        <tr><td>Iran</td><td>2014</td><td>~2,000</td><td>tonnes/year</td><td>Ansari-Renani, <em>A Value Chain and Marketing of Iranian Cashmere</em>, Media Peternakan 37(1), 2014</td><td>Peer-reviewed published estimate</td><td>The exact quantity is stated as unknown; the study estimates that about 5 million cashmere goats produce approximately 2,000 tonnes of raw cashmere annually. Historical estimate, not an official national statistic.</td></tr>\\n        <tr><td>India</td><td>2013–14</td><td>50</td><td>tonnes/year</td><td><em>Cashmere producing smallholder nomads of Himalaya: Survival challenges of a system</em></td><td>Peer-reviewed regional/secondary production estimate</td><td>India's pashmina production is reported at about 50 tonnes/year, with Changthangi contributing approximately 90%. Historical regional pashmina figure; not a current comprehensive national cashmere series.</td></tr>\"; assert old in s, 'library Afghanistan row not found'; s=s.replace(old,add,1); p.write_text(s)"
          rm -f production-snippet.txt library-snippet.txt
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supply-chain.html library.html production-snippet.txt library-snippet.txt
          git commit -m 'Update audited cashmere production data'
          git rm .github/workflows/final-production-audit.yml
          git commit -m 'Remove temporary production audit workflow'
          git push